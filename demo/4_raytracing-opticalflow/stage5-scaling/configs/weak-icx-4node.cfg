# Purpose: DisCostiC config for RT+OF (RTOF4): rtof-weak-icx-4node.

number_of_timesteps = 100
heteregeneous = 0
collective_mode = 0
waitio_mode = socket
comm_model = 1

benchmark_kernel = RTOF4

micro_architecture = IcelakeSP_Platinum-8360Y
FP_instructions_per_cycle = 4
task_per_node = 72
number_of_processes = 287

compiler_flags = -O3_-fno-alias_-xCORE-AVX512_-qopt-zmm-usage=high
pmodel = ECM
vvv = 0
cache_predictor = LC

# Weak measured bumps MG with nodes (9→10→11→12). nxOF=(1<<(MG-1))+2, nxRT=SS*nxOF.
# MG=11, SS=2: nxOF=1026 → N=1052676; nxRT=2052 → Nsteps=4210704.
N = 1052676
Nsteps = 4210704
part1 = RT
part2 = OF
penalty = 0

idlewave = 0
which_rank = 0
at_timestep = 0
desync = 0
barrier_flag = 0

filename = rtof-weak-icx-4node.csv
timeunit_conv = 1
vizfilename = rtof-weak-icx-4node
chromevizfilename = rtof-weak-icx-4node
Verbose = 1
batchmode = 0

FLOPs_per_iteration = 2
R_streams = 3
W_streams = 1
datasize_in_GB = 4.0
