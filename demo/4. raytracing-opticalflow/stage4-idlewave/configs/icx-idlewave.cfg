# Purpose: DisCostiC config for RT+OF (RTOF4): rtof-idlewave.

number_of_timesteps = 45
heteregeneous = 0
collective_mode = 0
waitio_mode = socket
comm_model = 1

benchmark_kernel = RTOF4

micro_architecture = IcelakeSP_Platinum-8360Y
FP_instructions_per_cycle = 4
task_per_node = 72
number_of_processes = 71

compiler_flags = -O3_-fno-alias_-xCORE-AVX512_-qopt-zmm-usage=high
pmodel = ECM
vvv = 0
cache_predictor = LC

# N = OF loop size (nxOF*nyOF); Nsteps = RT loop size (nxRT*nyRT).
# MG=9, SS=2: nxOF=258 → N=66564; nxRT=516 → Nsteps=266256
N = 66564
Nsteps = 266256
part1 = RT
part2 = OF
penalty = 0

idlewave = 1
which_rank = 4
at_timestep = 5
desync = 0
barrier_flag = 0

filename = rtof-idlewave.csv
timeunit_conv = 1
vizfilename = rtof-idlewave
chromevizfilename = rtof-idlewave
Verbose = 1
batchmode = 0

FLOPs_per_iteration = 2
R_streams = 3
W_streams = 1
datasize_in_GB = 1.0
